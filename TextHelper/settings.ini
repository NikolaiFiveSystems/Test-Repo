; Настройки TextHelper. Кодировка файла — UTF-8.
; Комментарии пишите только на отдельной строке, начиная с «;».
; После изменений: значок TextHelper в трее → «Перезапустить».

[Hotkeys]
; ^ = Ctrl, ! = Alt, + = Shift, # = Win.
; vk46 — клавиша F, vk52 — клавиша R. Коды клавиш работают при любой раскладке.
; Коды других букв: vk41 = A, vk42 = B … vk5A = Z (по латинской букве на клавише).
Fix=^!vk46
Menu=^!vk52

[General]
; Какая языковая модель переформулирует текст (Ctrl+Alt+R):
;   gigachat — GigaChat от Сбера: работает в РФ, для физлиц есть бесплатный пакет
;   local    — модель на вашем компьютере через Ollama: бесплатно и без интернета
;   claude   — Claude от Anthropic: платно, официально недоступен в РФ
Provider=gigachat
; 1 — если ничего не выделено, выделить всё поле ввода (Ctrl+A) и обработать его.
SelectAllIfEmpty=0
; Прокси для всех запросов, например 127.0.0.1:8080 (пусто — без прокси).
Proxy=

[GigaChat]
; «Ключ авторизации» из личного кабинета GigaChat API (developers.sber.ru → Настройки API).
; Можно не писать сюда, а задать переменную окружения GIGACHAT_CREDENTIALS.
AuthKey=
; GIGACHAT_API_PERS — физлица, GIGACHAT_API_B2B / GIGACHAT_API_CORP — организации.
Scope=GIGACHAT_API_PERS
; GigaChat-2 (быстрее, больше бесплатных токенов), GigaChat-2-Pro или GigaChat-2-Max (лучше пишут).
Model=GigaChat-2
; Проверять сертификат серверов Сбера: 0 — нет (работает без установки сертификата Минцифры),
; 1 — да (сначала установите «Russian Trusted Root CA» с gosuslugi.ru/crt).
VerifySsl=0
; Адреса API — менять, только если Сбер их сменит.
;AuthUrl=https://ngw.devices.sberbank.ru:9443/api/v2/oauth
;ChatUrl=https://api.giga.chat/v1/chat/completions

[Local]
; Локальная модель: установите Ollama (ollama.com), затем в командной строке:
;   ollama pull qwen2.5:7b
; Подойдёт и LM Studio или любой сервис с OpenAI-совместимым API —
; укажите его адрес …/v1/chat/completions, модель и ключ.
Url=http://localhost:11434/v1/chat/completions
Model=qwen2.5:7b
ApiKey=

[LanguageTool]
; Бесплатная проверка орфографии (Ctrl+Alt+F). Можно указать свой сервер LanguageTool.
Url=https://api.languagetool.org/v2/check
; auto — определить язык самому, или явно: ru-RU, en-US, uk-UA, de-DE…
Language=auto
; Какой вариант английского (и т.п.) выбирать при Language=auto.
PreferredVariants=en-US
; Типы замечаний, которые НЕ исправлять автоматически (через запятую).
; Возможные: misspelling, grammar, typographical, whitespace, style, …
SkipIssueTypes=style
; Для LanguageTool Premium (необязательно): e-mail и API-ключ из личного кабинета.
Username=
ApiKey=

[Claude]
; Ключ API: https://platform.claude.com → API Keys.
; Можно не писать сюда, а задать переменную окружения ANTHROPIC_API_KEY.
ApiKey=
Model=claude-opus-5-5
; Насколько тщательно думать: low (быстро), medium, high.
Effort=low
; default — если модель откажется отвечать, запрос автоматически повторится
; на рекомендованной модели. Пусто — отключить.
Fallbacks=default

[Actions]
; Пункты меню Ctrl+Alt+R в формате «Название=Задание для модели».
; Добавляйте, удаляйте и меняйте строки как угодно — порядок сохраняется.
Исправить ошибки=Исправь орфографические, пунктуационные и грамматические ошибки. Больше ничего не меняй: ни слова, ни стиль, ни порядок.
Переформулировать=Перепиши текст своими словами: яснее и естественнее, сохранив смысл, тон и примерную длину.
Вежливее / деловой стиль=Перепиши текст в вежливом деловом стиле, подходящем для переписки с коллегами или клиентами.
Проще и дружелюбнее=Перепиши текст проще и дружелюбнее, как в разговоре с коллегой. Без канцелярита.
Короче=Сократи текст, оставив главное. Убери повторы и воду.
Подробнее=Сделай текст более развёрнутым и понятным, не добавляя новых фактов.
Перевести на английский=Переведи текст на английский язык, сохранив тон.
